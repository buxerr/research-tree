[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-tree"
version = "0.1.0"
description = "A local, provider-agnostic agent orchestrator for branching research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Research Tree contributors" }]
keywords = ["research", "agents", "orchestration", "llm", "tree-search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
research-tree = "research_tree.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

